# Redirects from addresses of the old website (www.ivl.disco.unimib.it) to their new location.
# One source for all hosts (see _plugins/ivl_redirects.rb):
#   - Netlify: written to /_redirects (real HTTP 301 redirects, also for command-line downloads);
#   - page addresses (ending in "/") also get a small HTML page that redirects at once (works on any host);
#   - GitHub Pages: the 404 page forwards browsers that land on any other address listed here.
# "from" is a path on this site, optionally with address parameters (?id=:id, where ":id" matches any value and can be
# used in "to"); "to" is a path on this site or a full URL.

# Old project pages that are now in the Projects section, and old pages that pointed to another site
- from: /activities/onfoods/
  to: /projects/onfoods/
- from: /activities/hpc/
  to: /projects/hpc/
- from: /activities/progetto-e4s-energy-for-safety/
  to: /projects/e4s/
- from: /activities/aicv4food/
  to: https://sites.google.com/unimib.it/aicv4food/

# Old pages that pointed to a minisite (copied into the site at its old address, /minisites/<name>/)
- from: /activities/dalib/
  to: /minisites/DALib/
- from: /activities/cciw-2024/
  to: /minisites/cciw-2024/
- from: /cciw-2024/
  to: /minisites/cciw-2024/
- from: /news-cciw-2024/
  to: /minisites/cciw-2024/

# RawFooT minisite (/minisites/rawfoot/): the old PHP pages are now static .html pages
- from: /minisites/rawfoot/index.php
  to: /minisites/rawfoot/
- from: /minisites/rawfoot/details.php
  to: /minisites/rawfoot/details.html
- from: /minisites/rawfoot/textures.php
  to: /minisites/rawfoot/textures.html
- from: /minisites/rawfoot/download.php
  to: /minisites/rawfoot/download.html
- from: /minisites/rawfoot/contact.php
  to: /minisites/rawfoot/contact.html
# address parameters: ":name" matches any value and can be reused in "to"
- from: /minisites/rawfoot/textures_detail.php?id=:id&name=:name
  to: /minisites/rawfoot/textures_detail_:id.html
- from: /minisites/rawfoot/textures_detail.php?id=:id
  to: /minisites/rawfoot/textures_detail_:id.html

